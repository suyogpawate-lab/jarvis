[package]
name = "jarvis-kokoro-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kokoro-en = { version = "0.1.5", default-features = false, features = ["misaki-lean"] }
# kokoro-en 0.1.5 targets this ORT prerelease API; prevent semver selecting rc.15.
ort = "=2.0.0-rc.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "fs", "time", "sync"] }
hound = "3.5"
