name: JARVIS regression checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Install test dependencies
        run: python -m pip install numpy pytest
      - name: Run syntax and regression tests
        run: |
          python scripts/smoke_test.py
          python -m pytest -q tests

  kitten-lightweight-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install eSpeak and lightweight Kitten frontend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install numpy soundfile huggingface_hub espeakng_loader phonemizer num2words nltk misaki==0.9.4 addict regex
          python -m pip install --no-deps kittenml==0.9.7
      - name: Verify Misaki lexicon with NLTK and eSpeak fallback
        run: |
          python - <<'PY'
          import nltk
          nltk.download("averaged_perceptron_tagger_eng", quiet=True)
          from voice.kitten_misaki import nltk_misaki_class
          g2p = nltk_misaki_class()()
          phonemes, tokens = g2p("Hello from JARVIS.", preprocess=False)
          assert phonemes.strip(), "Misaki + NLTK returned no phonemes"
          assert tokens, "NLTK returned no tokens"
          print("Misaki + NLTK OK:", phonemes)
          PY

  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check WhatsApp bridge syntax
        run: node --check whatsapp/bridge.js
