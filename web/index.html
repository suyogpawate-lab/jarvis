<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S.</title>
<style>
:root{--acc:#7fc79a;--on:#0d1510;--reply:#b7d4c0;--edge:#2e3a33;--dim:#555b57;--g1:#b7dca0;--g2:#7ac79a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0a0b0c;color:#e6eae7;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.p{position:relative;border:1px solid var(--edge);border-radius:12px;background:#141618;transition:border-color .3s}
.p>b{position:absolute;top:-9px;left:12px;padding:0 6px;background:#0a0b0c;color:var(--acc);font-size:12px}
.p>i{position:absolute;top:-9px;right:12px;padding:0 6px;background:#0a0b0c;color:var(--dim);font-size:11px;font-style:normal}
#top{display:flex;align-items:center;gap:10px;flex:none}
#brand{font-weight:800;letter-spacing:.18em;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#themes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
#themes button{flex:none;background:none;border:1px solid transparent;border-radius:8px;color:#aab0ac;padding:3px 9px;font:inherit;cursor:pointer}
#themes button.on{background:var(--acc);color:var(--on);font-weight:700}
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
@media(min-width:800px){#main{flex-direction:row}}
#left{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0;flex:0 0 32%}
@media(min-width:800px){#left{flex:1 1 55%}}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:4px;gap:4px;flex:none}
#tabs span{padding:5px 0;border-radius:8px;color:#aab0ac;transition:.2s}
#tabs .on{background:var(--acc);color:var(--on);font-weight:700}
#tabs .on.alert{background:#d64545;color:#fff}
#stage{flex:1;min-height:80px;position:relative;border-radius:12px;overflow:hidden;background:#0a0b0c}
canvas{position:absolute;inset:0;width:100%;height:100%}
#chip{position:absolute;right:8px;top:8px;font-size:11px;color:#c8cdc9;background:#16181a;padding:1px 8px;border-radius:6px}
#sub{position:absolute;left:8px;top:8px;font-size:11px;color:var(--dim)}
#chat{flex:1 1 45%;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#chead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--edge);font-size:12px;color:var(--dim)}
#chead button{background:none;border:1px solid var(--edge);border-radius:8px;color:#aab0ac;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
#chead button:hover{border-color:var(--acc);color:var(--acc)}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 6px;scroll-behavior:smooth}
#msgs .empty{margin:auto;color:var(--dim);text-align:center;padding:40px 0}
.m{display:flex;gap:10px;margin:0 0 16px}
.m.u{justify-content:flex-end}
.m.u .b{background:#1d2226;border:1px solid var(--edge);border-radius:16px 16px 4px 16px;padding:8px 12px;max-width:85%;color:#fff}
.m.a .av{width:24px;height:24px;border-radius:50%;flex:none;margin-top:2px;background:radial-gradient(circle at 35% 35%,var(--g1),var(--g2));box-shadow:0 0 10px var(--edge)}
.m.a .b{color:var(--reply);min-width:0;max-width:calc(100% - 36px)}
.b{white-space:pre-wrap;word-break:break-word}
.b pre{margin:6px 0;padding:8px 10px;background:#0a0b0c;border:1px solid var(--edge);border-radius:8px;overflow-x:auto;color:#e6eae7;white-space:pre}
.b code{background:#0a0b0c;border-radius:4px;padding:0 4px;color:#e6eae7}.b pre code{padding:0;background:none}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:bl 1.2s infinite ease-in-out both}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}
#in{flex:none;display:flex;align-items:flex-end;gap:8px;margin:6px 10px 10px;padding:8px 8px 8px 12px;border-radius:16px}
#in.act{border-color:var(--acc)}
#q{flex:1;min-width:0;background:none;border:0;outline:0;resize:none;color:#fff;font:inherit;caret-color:var(--acc);max-height:140px;padding:4px 0}
#q::placeholder{color:var(--dim)}
#go{flex:none;width:32px;height:32px;display:grid;place-items:center;background:var(--acc);color:var(--on);border:0;border-radius:50%;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#go:disabled{opacity:.4}
#ap{flex:none;margin:6px 10px 0;border-color:#ffb02e;padding:14px 12px 10px}#ap>b{color:#ffb02e}
#ap pre{margin:4px 0 8px;white-space:pre-wrap;word-break:break-all;color:#fff;max-height:7em;overflow:auto}
#ap .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#ap .r em{color:var(--dim);font-style:normal;font-size:12px;margin-left:auto}
#ap button{border:0;border-radius:10px;padding:9px 22px;font:inherit;font-weight:700;cursor:pointer}
#ap .y{background:#3fbf6f;color:#04140a}#ap .n{background:#d64545;color:#fff}#ap button:disabled{opacity:.4}
#chat.sp{border-color:var(--acc)}#chat.al{border-color:#d64545}

<script>

  if(!TH[n])return;TN=n;T=TH[n];SHAPE=T.shape;RAINBOW=!!T.rainbow;TINT=T.tint||TH.emerald.tint;

const cv=$('cv');
// ───────── GPU dust renderer (WebGL): every speck is a GL point, all maths runs in shaders ─────────
const N0=mx(1000,mn(400000,+(new URLSearchParams(location.search).get('dots'))||200000)),MAXPX=2.2e6;

const GLSL_COMMON=`

vec4 arcp(int i){if(i==0)return vec4(0.,1.,.79,1.);if(i==1)return vec4(2.3,.62,.79,1.);if(i==2)return vec4(4.1,.36,.79,1.);if(i==3)return vec4(1.,1.1,.63,-1.4);if(i==4)return vec4(4.,.7,.63,-1.4);return vec4(.5,.5,.93,.6);}
float lines(vec2 p,float r,float th,float lw){
 float d=.14*(1.-smoothstep(.96,1.,r)),pu=.5+.5*sin(now*(abs(stt-3.)<.5?6.:1.6));

  d=max(d,.5*ring(r,.97,lw));d=max(d,.35*ring(r,.86,lw));d=max(d,.45*ring(r,.72,lw));d=max(d,.3*ring(r,.5,lw));d=max(d,.9*ring(r,.3,lw));

  for(int i=0;i<6;i++){vec4 q=arcp(i);d=max(d,step(mod(th-(q.x+t*q.w),P2),q.y)*ring(r,q.z,lw*1.6));}

 }else if(S(12.)){
  d=max(d,.3*ring(r,.25,lw));d=max(d,.3*ring(r,.5,lw));d=max(d,.3*ring(r,.75,lw));d=max(d,.6*ring(r,.96,lw));
  float ag=fract(th/P2*72.);d=max(d,.5*G(min(ag,1.-ag)*P2/72.*r,lw)*step(.92,r)*step(r,.97));
  float a=t*1.8,tr=1.-mod(a-th,P2)/1.3;if(tr>0.)d=max(d,.9*tr*tr*step(r,.97));
  for(int i=0;i<9;i++){float fi=float(i),ba=h11(fi+1.)*P2,v=1.-mod(a-ba,P2)/(P2*.85);
   if(v>.1)d=max(d,v*G(length(p-(.25+.7*h11(fi+40.))*.96*vec2(cos(ba),sin(ba))),lw*2.5));}
  d=max(d,G(r,lw*2.));
 }else if(S(13.)){
  d=max(d,step(r,(.07+.02*pu)*.96));d=max(d,.5*ring(r,.14,lw));
  for(int i=0;i<3;i++){float fi=float(i),tilt=t*.12+fi*PI/3.,ea=t*(1.3+fi*.45)+fi*2.1;
   d=max(d,.28*G((length(rot(p,-tilt)/vec2(.96,.34))-1.)*.34,lw));

  d=max(d,G(r,lw*2.5));
 }else{
  d=max(d,.3*ring(r,.96,lw));d=max(d,G(r,lw*3.));
  float nb=stt<.5?2.:stt<1.5?3.:stt<2.5?4.:stt<3.5?6.:7.,per=stt<.5?.45:stt<1.5?.3:stt<2.5?.2:stt<3.5?.09:.07,bk=floor(now/per);
  for(int b=0;b<7;b++){if(float(b)>=nb)break;float sd=h11(bk*31.+float(b)),an=sd*P2;vec2 dir=vec2(cos(an),sin(an));
   float f=dot(p,dir)/.96,lat=dot(p,vec2(-dir.y,dir.x));

F field(vec2 p){

 vec2 uv=p*inv;float th=th0;
 if(abs(stt-2.)<.5){float a=t*.9*(1.2-min(r,1.));uv=rot(uv,a);th+=a;}

 if(S(1.))re=.86+.09*sin(3.*th+t*.5)+.06*sin(5.*th-t*.7)+.04*sin(9.*th+t);
 else if(S(2.))re=.46+.5*pow(abs(cos(4.*th+t*.2)),6.)+.03*sin(7.*th-t);
 else if(S(3.))re=.88+.04*sin(3.*th+t*.5);
 else if(S(4.))re=.9+.015*sin(6.*th+t);
 else if(S(5.))re=.82+.02*sin(5.*th-t*.6);
 else if(S(6.))re=.84+.06*sin(4.*th+t*.4)+.04*sin(7.*th-t*.5);
 else if(S(7.))re=.5+.42*pow(abs(cos(3.*th+t*.12)),3.);

 else if(S(9.))re=.9;
 else re=.9+.02*sin(5.*th+t*.6);
 float mask=clamp((re+.12-r)/.42,0.,1.);if(mask<=0.)return o;
 float n=.5+.5*(.5*sin(u*5.1+t*.3+sin(v*3.3+t*.2)*1.7)+.3*sin(v*6.7-t*.25+sin(u*4.1)*1.3)+.2*sin((u+v)*9.3+t*.4));
 float rim=exp(-sq((r-re*.82)/.22)),wisp=0.,rip=0.,ex=0.,pb=0.;

 if(abs(stt-3.)<.5)rip=.12*sin(r*14.-now*9.);else if(abs(stt-1.)<.5)rip=.12*sin(r*12.+now*5.);
 if(S(10.))ex=.6*exp(-sq((mod(r*4.2-t*.15,1.)-.5)/.16))+.7*exp(-sq(r/.12));
 else if(S(2.))ex=.8*exp(-sq(r/.3));
 else if(S(3.))ex=.75*pow((cos(2.*th-r*7.+t*.5)+1.)/2.,3.)*exp(-r*1.2)+.7*exp(-sq(r/.12));

const VS=GLSL_COMMON+`
attribute vec4 a;

void main(){

 float dd=f.d*gain;if(stt>3.5)dd+=.15*h11(a.z*91.+rnd)-.05;
 if(dd<=.02||dd<tr){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=0.;vc=vec3(0.);return;}
 vec3 col=mix(c0,c1,f.f);
 if(shp>10.5)col=mix(c0,c1,f.f)*(.2+.8*f.f)+c1*.3*pow(f.f,4.);
 else if(stt<3.5){if(rbw>.5)col=hsv(f.hue,.62,1.)*(.22+.78*f.f)+.2*pow(f.f,3.);else col=mix(col,alt*(.35+.65*f.f),.6*f.cf);}
 vc=col*(.8+.2*sin(t*3.+a.w*40.))*.95;
 gl_Position=vec4(p.x*R*2./res.x,-p.y*R*2./res.y,0.,1.);
 gl_PointSize=ps*(.8+.5*a.w);
}`;
const FS=`precision mediump float;varying vec3 vc;void main(){gl_FragColor=vec4(vc,1.);}`;
const HVS=`attribute vec2 q;void main(){gl_Position=vec4(q,0.,1.);}`;
const HFS=GLSL_COMMON+`
void main(){
 vec2 p=vec2(gl_FragCoord.x-res.x*.5,res.y*.5-gl_FragCoord.y)/R;
 float hz;if(shp>10.5)hz=.12*(1.-smoothstep(.9,1.05,length(p)));else hz=field(p).hz;
 gl_FragColor=vec4(vec3(.039,.043,.047)+c2*hz,1.);
}`;
try{
 gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
 if(!gl)throw new Error('WebGL unavailable');
 const mk=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
 const pg=(v,f,at)=>{const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,v));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,f));gl.bindAttribLocation(p,0,at);gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p};
 HP=pg(HVS,HFS,'q');SP=pg(VS,FS,'a');
 qbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qbuf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const r=rng(5),A=new Float32Array(400000*4);for(let i=0;i<A.length;i++)A[i]=r();
 sbuf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,sbuf);gl.bufferData(gl.ARRAY_BUFFER,A,gl.STATIC_DRAW);
 gl.enableVertexAttribArray(0);
}catch(e){GL_ERR=String(e.message||e).slice(0,300);console.error(e);HP=null}
function uni(P,o){for(const k in o){const l=gl.getUniformLocation(P,k),v=o[k];if(!l)continue;Array.isArray(v)?(v.length===2?gl.uniform2fv(l,v):gl.uniform3fv(l,v)):gl.uniform1f(l,v)}}
function draw(now,dt,st){
 if(!HP){$('sub').textContent='WebGL error: '+GL_ERR;return}
 const W0=cv.clientWidth,H0=cv.clientHeight,k=mn(mn(window.devicePixelRatio||1,2),Math.sqrt(MAXPX/mx(1,W0*H0))),W=mx(1,Math.round(W0*k)),H=mx(1,Math.round(H0*k));
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 gl.viewport(0,0,W,H);
 const tg=target(st);if(!CC)CC=tg.map(v=>v.slice());const a=1-exp(-dt*6);for(let i=0;i<4;i++)for(let j=0;j<3;j++)CC[i][j]+=(tg[i][j]-CC[i][j])*a;
 const Rp=.48*mn(W,H),br=st==='speaking'?1+.035*sin(now*7):st==='listening'?.93+.04*sin(now*2):st==='alert'?1+.05*sin(now*14):1;
 const U={t:phase,now:now%10000,gain:1.5,br,shp:SID,stt:STI[st],px:1/Rp,rbw:RAINBOW?1:0,R:Rp,ps:mx(1.4,mn(3.5,Rp/225*1.1)),rnd:Math.floor(now*30)%1000,res:[W,H],c0:CC[0],c1:CC[1],c2:CC[2],alt:CC[3]};
 gl.disable(gl.BLEND);gl.useProgram(HP);uni(HP,U);gl.bindBuffer(gl.ARRAY_BUFFER,qbuf);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.useProgram(SP);uni(SP,U);gl.bindBuffer(gl.ARRAY_BUFFER,sbuf);gl.vertexAttribPointer(0,4,gl.FLOAT,false,0,0);gl.drawArrays(gl.POINTS,0,cnt);
 // keep it smooth + cool: shed specks only if the GPU can't hold ~45fps, win them back when it can
 avgMs=avgMs*.95+dt*1000*.05;if(++nfr%90===0){if(avgMs>24&&cnt>60000)cnt=Math.floor(cnt*.8);else if(avgMs<18&&cnt<N0)cnt=mn(N0,Math.floor(cnt*1.15))}
 dots=cnt;$('chip').textContent=dots.toLocaleString()+' specks of dust';$('sub').textContent=TN+' · '+Math.round(fps)+' fps';
}

let S={state:'standby',busy:false,reply:'',theme:'emerald',pending:[],hn:0},phase=0,lastT=performance.now()/1000,fps=0;
function dispState(){return S.state==='standby'&&$('q').value?'listening':S.state}

// ── chat history ──
let M=[],hn=-1,loaded=false;const rev={},nodes={};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(t){return esc(t).replace(/```(?:\w*\n)?([\s\S]*?)(```|$)/g,'<pre><code>$1</code></pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b style="color:#fff">$1</b>')}
async function loadHist(){try{const r=await fetch('/api/history',{cache:'no-store'}).then(r=>r.json());
 for(const m of r.msgs)if(!(m.id in rev))rev[m.id]=loaded&&m.role==='assistant'?Date.now():0;
 M=r.msgs;hn=r.n;loaded=true;syncMsgs()}catch(e){}}
function syncMsgs(){const box=$('msgs'),keep=new Set(M.map(m=>m.id));
 for(const id in nodes)if(!keep.has(+id)){nodes[id].remove();delete nodes[id]}
 const empty=box.querySelector('.empty');
 if(!M.length&&!empty&&!S.busy)box.insertAdjacentHTML('afterbegin','<div class="empty">Neural core online.<br>Ask Jarvis anything.</div>');
 else if((M.length||S.busy)&&empty)empty.remove();
 for(const m of M)if(!nodes[m.id]){const d=document.createElement('div');d.className='m '+(m.role==='user'?'u':'a');
  d.innerHTML=(m.role==='user'?'':'<div class="av"></div>')+'<div class="b"></div>';box.appendChild(d);nodes[m.id]=d;d.dataset.t='';box.scrollTop=box.scrollHeight}
 const ty=$('typing');if(S.busy&&S.state==='thinking'){if(!ty){const d=document.createElement('div');d.id='typing';d.className='m a';d.innerHTML='<div class="av"></div><div class="b"><span class="dots"><i></i><i></i><i></i></span></div>';box.appendChild(d);box.scrollTop=box.scrollHeight}else box.appendChild(ty)}
 else if(ty)ty.remove()}
function paintMsgs(){const box=$('msgs'),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<60;let grew=false;
 for(const m of M){const d=nodes[m.id];if(!d)continue;let t=m.text;
  if(m.role==='assistant'&&rev[m.id]){const n=Math.floor((Date.now()-rev[m.id])/1000*70);if(n<t.length)t=t.slice(0,n);else rev[m.id]=0}
  if(d.dataset.t!==t){d.dataset.t=t;d.lastChild.innerHTML=fmt(t);grew=true}}
 if(grew&&atEnd)box.scrollTop=box.scrollHeight}

function frame(){
 const now=performance.now()/1000,dt=now-lastT;fps=fps*.9+(1/mx(dt,1e-3))*.1;const st=dispState();phase+=dt*TS[st];lastT=now;
 draw(now,dt,st);
 paintMsgs();
 document.querySelectorAll('#tabs span').forEach(e=>{const on=e.dataset.s===st;e.className=on?'on '+st:''});
 $('in').classList.toggle('act',!!$('q').value||S.busy);$('chat').className='p'+(st==='alert'?' al':st==='speaking'?' sp':'');
 $('go').disabled=S.busy;
 const pn=S.pending||[],p0=pn[0];$('ap').hidden=!p0;
 if(p0){const k=p0.kind+p0.code;if($('ap').dataset.k!==k){$('ap').dataset.k=k;$('apr').textContent='⚠ '+p0.reason+(pn.length>1?'  (+'+(pn.length-1)+' more)':'');$('apc').textContent=p0.command;$('apy').disabled=$('apn').disabled=false}
  $('apt').textContent=p0.expires?'expires in '+mx(0,Math.round(p0.expires-Date.now()/1000))+'s':''}
 requestAnimationFrame(frame)}

// ── wiring ──
$('tabs').className='p';$('tabs').innerHTML=STATES.map(s=>`<span data-s="${s}">${s[0].toUpperCase()+s.slice(1)}</span>`).join('');
$('themes').innerHTML=ORDER.map(n=>`<button data-n="${n}">${n}</button>`).join('');
$('themes').onclick=e=>{const n=e.target.dataset.n;if(n){setTheme(n);post('/api/theme',{name:n})}};
const hist=[];let hi=-1;
function post(u,b){return fetch(u,{method:'POST',headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({}))}
function grow(){const q=$('q');q.style.height='auto';q.style.height=mn(140,q.scrollHeight)+'px'}
async function send(){const q=$('q'),t=q.value.trim();if(!t||S.busy)return;hist.push(t);hi=-1;q.value='';grow();
 const r=await post('/api/chat',{text:t});if(r.result==='busy'){q.value=t;grow()}loadHist()}
$('go').onclick=send;
$('clr').onclick=async()=>{await post('/api/clear',{});loadHist()};
for(const[id,a]of[['apy','approve'],['apn','deny']])$(id).onclick=async()=>{const p=(S.pending||[])[0];if(!p)return;$('apy').disabled=$('apn').disabled=true;
 const r=await post('/api/decide',{kind:p.kind,code:p.code,action:a});if(r.result==='busy'||r.result==='not pending')$('ap').dataset.k=''};
$('q').oninput=grow;
$('q').onkeydown=e=>{const q=$('q');
 if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
 else if(e.key==='ArrowUp'&&hist.length&&(!q.value||hi>=0)){hi=hi<0?hist.length-1:mx(0,hi-1);q.value=hist[hi];grow();e.preventDefault()}
 else if(e.key==='ArrowDown'&&hi>=0){hi++;q.value=hi>=hist.length?'':hist[hi];if(hi>=hist.length)hi=-1;grow();e.preventDefault()}};
function connect(){const es=new EventSource('/events');
 es.onmessage=m=>{const d=JSON.parse(m.data);S=d;if(d.theme!==TN)setTheme(d.theme);if(d.hn!==hn)loadHist();syncMsgs()};
 es.onerror=()=>{es.close();setTimeout(connect,1500)}}
setTheme('emerald');loadHist();connect();requestAnimationFrame(frame);
</script></body></html>
